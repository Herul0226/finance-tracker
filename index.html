<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keuanganku - Mobile App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #e2e8f0; overscroll-behavior-y: none; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: #f8fafc; min-height: 100vh; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; }
        .view-section { display: none; animation: fadeIn 0.3s ease-in-out; padding-bottom: 90px; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        @keyframes slideDown { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        .toast-animate { animation: slideDown 0.3s ease-out forwards; }
        .loader { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        .loader-dark { border: 3px solid #e2e8f0; border-top: 3px solid #4f46e5; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none"></div>

    <div class="app-container">
        <header class="bg-white px-5 py-4 sticky top-0 z-40 flex items-center justify-between shadow-[0_4px_20px_-15px_rgba(0,0,0,0.1)]">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white"><i class="ph-bold ph-wallet"></i></div>
                <h1 class="text-lg font-bold tracking-tight">Keuanganku</h1>
            </div>
            <div id="header-status" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-100 text-xs font-medium text-slate-500">
                <span class="w-2 h-2 rounded-full bg-slate-400"></span> Offline
            </div>
        </header>

        <main class="flex-grow relative overflow-y-auto custom-scrollbar">
            
            <section id="view-dashboard" class="view-section active p-5">
                <div class="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-3xl p-6 text-white shadow-lg shadow-indigo-200 mb-6 relative overflow-hidden">
                    <i class="ph-fill ph-coins absolute -right-4 -bottom-4 text-8xl opacity-10"></i>
                    <p class="text-indigo-100 text-sm font-medium mb-1">Total Saldo Saat Ini</p>
                    <h2 class="text-3xl font-bold tracking-tight mb-6" id="dash-balance">Rp 0</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white/20 backdrop-blur-md rounded-2xl p-3">
                            <div class="flex items-center gap-1.5 text-indigo-50 mb-1 text-xs"><i class="ph-fill ph-arrow-down-left text-emerald-400"></i> Pemasukan</div>
                            <p class="font-semibold text-sm" id="dash-income">Rp 0</p>
                        </div>
                        <div class="bg-white/20 backdrop-blur-md rounded-2xl p-3">
                            <div class="flex items-center gap-1.5 text-indigo-50 mb-1 text-xs"><i class="ph-fill ph-arrow-up-right text-rose-400"></i> Pengeluaran</div>
                            <p class="font-semibold text-sm" id="dash-expense">Rp 0</p>
                        </div>
                    </div>
                </div>

                <div class="mt-8">
                    <div class="flex justify-between items-end mb-4">
                        <h3 class="font-bold text-slate-800">Transaksi Terakhir</h3>
                        <button onclick="switchTab('history')" class="text-xs font-medium text-indigo-600">Lihat Semua</button>
                    </div>
                    <div id="dash-recent-list" class="space-y-3">
                        <div class="text-center py-8 text-slate-400 text-sm" id="dash-empty">Belum ada transaksi</div>
                    </div>
                </div>
            </section>

            <section id="view-add" class="view-section p-5">
                <h2 class="text-xl font-bold text-slate-800 mb-6">Tambah Transaksi</h2>
                <form id="add-form" class="space-y-5 bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <div class="bg-slate-100 p-1 rounded-xl flex gap-1">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="tx-type" value="expense" class="peer hidden" checked>
                            <div class="text-center py-2 rounded-lg text-sm font-medium peer-checked:bg-white peer-checked:text-rose-600 peer-checked:shadow-sm text-slate-500 transition-all">Pengeluaran</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="tx-type" value="income" class="peer hidden">
                            <div class="text-center py-2 rounded-lg text-sm font-medium peer-checked:bg-white peer-checked:text-emerald-600 peer-checked:shadow-sm text-slate-500 transition-all">Pemasukan</div>
                        </label>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1.5">Jumlah (Rp)</label>
                        <input type="number" id="input-amount" placeholder="0" required min="1" class="w-full bg-slate-50 border border-slate-200 text-slate-900 text-lg font-semibold rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1.5">Kategori</label>
                            <select id="input-category" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="Makanan">Makanan</option>
                                <option value="Transport">Transport</option>
                                <option value="Belanja">Belanja</option>
                                <option value="Gaji">Gaji</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1.5">Tanggal</label>
                            <input type="date" id="input-date" required class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1.5">Catatan</label>
                        <input type="text" id="input-desc" required class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" id="btn-submit-tx" class="w-full bg-indigo-600 text-white font-semibold rounded-xl py-4 hover:bg-indigo-700">Simpan Transaksi</button>
                </form>
            </section>

            <section id="view-history" class="view-section p-5 h-full flex-col">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-slate-800">Riwayat</h2>
                </div>
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden flex flex-col min-h-[400px]">
                    <ul id="history-list" class="divide-y divide-slate-100 flex-grow"></ul>
                </div>
            </section>

            <section id="view-settings" class="view-section p-5">
                <h2 class="text-xl font-bold text-slate-800 mb-6">Pengaturan Database</h2>
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-6">
                    <form id="settings-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1.5">Project URL</label>
                            <input type="url" id="input-supabase-url" placeholder="https://xxxx.supabase.co" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-4 py-3">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1.5">Anon Key</label>
                            <input type="password" id="input-supabase-key" placeholder="eyJhbGciOiJIUzI1NiIsIn..." class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-4 py-3">
                        </div>
                        <button type="submit" class="w-full bg-slate-900 text-white font-semibold rounded-xl py-3.5 hover:bg-slate-800">Simpan & Hubungkan</button>
                    </form>
                </div>
            </section>
        </main>

        <nav class="bg-white border-t border-slate-200 fixed bottom-0 w-full max-w-[480px] z-50 px-2 pb-safe">
            <div class="flex justify-around items-center h-16">
                <button onclick="switchTab('dashboard')" id="tab-dashboard" class="nav-tab active flex flex-col items-center justify-center w-16 text-slate-400">
                    <i class="ph-fill ph-house text-2xl mb-1"></i><span class="text-[10px] font-medium">Beranda</span>
                </button>
                <button onclick="switchTab('history')" id="tab-history" class="nav-tab flex flex-col items-center justify-center w-16 text-slate-400">
                    <i class="ph-fill ph-list-dashes text-2xl mb-1"></i><span class="text-[10px] font-medium">Riwayat</span>
                </button>
                <div class="relative -top-5">
                    <button onclick="switchTab('add')" id="tab-add" class="w-14 h-14 bg-indigo-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-indigo-300">
                        <i class="ph-bold ph-plus text-2xl"></i>
                    </button>
                </div>
                <button onclick="switchTab('settings')" id="tab-settings" class="nav-tab flex flex-col items-center justify-center w-16 text-slate-400">
                    <i class="ph-fill ph-gear text-2xl mb-1"></i><span class="text-[10px] font-medium">Setelan</span>
                </button>
            </div>
        </nav>
        <style> .nav-tab.active { color: #4f46e5; } </style>
    </div>

    <script>
        let supabaseClient = null;
        let transactions = [];
        let isConnected = false;
        
        document.getElementById('input-date').value = new Date().toISOString().split('T')[0];

        function switchTab(tabId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${tabId}`).classList.add('active');
            if(tabId !== 'add') document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        async function initDatabase() {
            const url = localStorage.getItem('sb_url');
            const key = localStorage.getItem('sb_key');
            if (url && key) {
                document.getElementById('input-supabase-url').value = url;
                document.getElementById('input-supabase-key').value = key;
                try {
                    supabaseClient = window.supabase.createClient(url, key);
                    isConnected = true;
                    document.getElementById('header-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Online';
                    await fetchData();
                } catch (err) {
                    isConnected = false;
                }
            }
        }

        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('input-supabase-url').value.trim();
            const key = document.getElementById('input-supabase-key').value.trim();
            if(!url || !key) return;

            try {
                const testClient = window.supabase.createClient(url, key);
                const { error } = await testClient.from('transactions').select('id').limit(1);
                if (error) {
                    // ALERT UNTUK MENANGKAP ERROR KONEKSI AWAL
                    alert("🚨 ERROR KONEKSI SUPABASE:\n\n" + error.message);
                    throw error;
                }
                localStorage.setItem('sb_url', url);
                localStorage.setItem('sb_key', key);
                alert("Database berhasil dihubungkan!");
                await initDatabase();
                switchTab('dashboard');
            } catch (err) {
                console.error(err);
            }
        });

        async function fetchData() {
            if(!isConnected) return;
            try {
                const { data, error } = await supabaseClient
                    .from('transactions')
                    .select('*')
                    .order('date', { ascending: false })
                    .order('id', { ascending: false });

                if (error) {
                    // ALERT UNTUK MENANGKAP ERROR SAAT MENGAMBIL DATA RIWAYAT
                    alert("🚨 ERROR TARIK DATA DARI SUPABASE:\n\n" + error.message + "\n\n(Tolong fotokan ini ke saya!)");
                    throw error;
                }
                transactions = data || [];
                renderUI();
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!isConnected) return alert('Hubungkan database dulu!');

            const type = document.querySelector('input[name="tx-type"]:checked').value;
            const amount = parseFloat(document.getElementById('input-amount').value);
            const category = document.getElementById('input-category').value;
            const date = document.getElementById('input-date').value;
            const desc = document.getElementById('input-desc').value;

            try {
                const { data, error } = await supabaseClient
                    .from('transactions')
                    .insert([{ type, amount, category, date, description: desc }])
                    .select();

                if(error) {
                    alert("🚨 ERROR SIMPAN DATA:\n\n" + error.message);
                    throw error;
                }
                transactions.unshift(data[0]);
                document.getElementById('input-amount').value = ''; 
                document.getElementById('input-desc').value = '';
                renderUI();
                switchTab('dashboard');
            } catch (err) {
                console.error(err);
            }
        });

        async function deleteTx(id) {
            try {
                await supabaseClient.from('transactions').delete().eq('id', id);
                transactions = transactions.filter(t => t.id !== id);
                renderUI();
            } catch (err) { console.error(err); }
        }

        function renderUI() {
            try {
                let income = 0; let expense = 0;
                transactions.forEach(tx => {
                    const nominal = Number(tx.amount) || 0;
                    if (tx.type === 'income') income += nominal;
                    if (tx.type === 'expense') expense += nominal;
                });

                document.getElementById('dash-balance').innerText = "Rp " + (income - expense).toLocaleString('id-ID');
                document.getElementById('dash-income').innerText = "Rp " + income.toLocaleString('id-ID');
                document.getElementById('dash-expense').innerText = "Rp " + expense.toLocaleString('id-ID');

                const historyList = document.getElementById('history-list');
                const dashRecent = document.getElementById('dash-recent-list');
                
                historyList.innerHTML = ''; dashRecent.innerHTML = '';

                transactions.forEach((tx, index) => {
                    const sign = tx.type === 'income' ? '+' : '-';
                    const amountClass = tx.type === 'income' ? 'text-emerald-600' : 'text-slate-800';
                    const safeAmount = Number(tx.amount) || 0;
                    const formattedText = safeAmount.toLocaleString('id-ID');
                    
                    const itemHTML = `
                        <div class="flex items-center gap-4 py-4 px-5">
                            <div class="flex-grow min-w-0">
                                <p class="text-sm font-bold text-slate-800 truncate">${tx.description || '-'}</p>
                                <p class="text-[11px] text-slate-400">${tx.date}</p>
                            </div>
                            <div class="text-right shrink-0">
                                <p class="text-sm font-bold ${amountClass}">${sign}Rp ${formattedText}</p>
                                <button onclick="deleteTx(${tx.id})" class="text-xs text-rose-500 mt-1">Hapus</button>
                            </div>
                        </div>
                    `;

                    const li = document.createElement('li');
                    li.innerHTML = itemHTML;
                    historyList.appendChild(li);

                    if (index < 3) {
                        const div = document.createElement('div');
                        div.className = "bg-white p-3 rounded-2xl shadow-sm border border-slate-100";
                        div.innerHTML = `
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="text-xs font-bold text-slate-800">${tx.description || '-'}</p>
                                </div>
                                <p class="text-xs font-bold ${amountClass}">${sign}Rp ${formattedText}</p>
                            </div>
                        `;
                        dashRecent.appendChild(div);
                    }
                });
            } catch (err) {
                // ALERT JIKA ERROR SAAT MENGGAMBAR TAMPILAN
                alert("🚨 ERROR TAMPILAN JAVASCRIPT:\n\n" + err.message + "\n\n(Tolong fotokan ini ke saya!)");
                console.error("Render Error:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDatabase();
            switchTab('dashboard');
        });
    </script>
</body>
</html>
